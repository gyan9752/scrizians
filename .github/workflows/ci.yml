name: Scrizians CI/CD Pipeline

# Kab chalegi: Jab bhi 'main' branch par code push hoga
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Test & Lint Check
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Diagnostics
        run: |
          echo "All dependencies verified successfully!"

  # Job 2: Next.js Production Build (ye tabhi chalega jab 'test' pass hoga)
  build:
    name: 🏗️ Production Build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Build Success Notification
        run: |
          echo "Next.js Production Build Passed with 0 Errors!"