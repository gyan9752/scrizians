# GitLab Runner ke liye Node.js environment
default:
  image: node:20

# Do stages: pehle test, fir build
stages:
  - test
  - build

# Cache taaki har baar node_modules dobara download na karna pade (pipeline fast ho jati hai)
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - frontend/node_modules/

# Job 1: Test & Typecheck
frontend-test:
  stage: test
  script:
    - echo "Testing frontend..."
    - cd frontend
    - npm ci || npm install
    - echo "Dependencies installed successfully!"

# Job 2: Next.js Production Build
frontend-build:
  stage: build
  script:
    - echo "Building Next.js frontend..."
    - cd frontend
    - npm ci || npm install
    - npm run build
    - echo "Build completed successfully!"